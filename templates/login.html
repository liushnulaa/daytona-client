{% extends 'base.html' %}

{% block title %}Daytona Client - Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Login to Daytona Client</h3>
                </div>
                <div class="card-body">
                    <form method="post" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="api_token" class="form-label">API Token</label>
                            <input type="text" class="form-control" id="api_token" name="api_token" required>
                            <div class="form-text">Enter your Daytona API token</div>
                        </div>
                        <div class="mb-3">
                            <label for="org_id" class="form-label">Organization ID (Optional)</label>
                            <input type="text" class="form-control" id="org_id" name="org_id">
                            <div class="form-text">Enter your Daytona Organization ID if applicable</div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
