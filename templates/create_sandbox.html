{% extends 'base.html' %}

{% block title %}Daytona Client - Create Sandbox{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Create Sandbox</h1>
        <a href="{{ url_for('list_sandboxes') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Sandboxes
        </a>
    </div>
    
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card bg-dark text-light">
                <div class="card-body">
                    <form method="post" action="{{ url_for('create_sandbox') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Sandbox Name</label>
                            <input type="text" class="form-control bg-dark text-light" id="name" name="name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="image" class="form-label">Image</label>
                            <select class="form-select bg-dark text-light" id="image" name="image" required>
                                <option value="" selected disabled>Select an image</option>
                                {% for image in images %}
                                <option value="{{ image.name }}">
                                    {{ image.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="cpu" class="form-label">CPU Cores</label>
                                    <input type="number" class="form-control bg-dark text-light" id="cpu" name="cpu" min="1" value="2">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="memory" class="form-label">Memory (GB)</label>
                                    <input type="number" class="form-control bg-dark text-light" id="memory" name="memory" min="1" value="4">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="disk" class="form-label">Disk (GB)</label>
                                    <input type="number" class="form-control bg-dark text-light" id="disk" name="disk" min="5" value="20">
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-secondary" onclick="window.location.href='{{ url_for('list_sandboxes') }}'">Cancel</button>
                            <button type="submit" class="btn btn-primary">Create</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
