{% extends 'base.html' %}

{% block title %}Daytona Client - Create Image{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Create Image</h1>
        <a href="{{ url_for('list_images') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Images
        </a>
    </div>
    
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-body">
                    <form method="post" action="{{ url_for('create_image') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Image Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                            <div class="form-text">A friendly name for your image</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="image" class="form-label">Docker Image</label>
                            <input type="text" class="form-control" id="image" name="image" required>
                            <div class="form-text">Docker image name (e.g., ubuntu, node, python)</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="tag" class="form-label">Tag</label>
                            <input type="text" class="form-control" id="tag" name="tag" value="latest">
                            <div class="form-text">Docker image tag (e.g., latest, 3.9, 16)</div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Create Image</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
